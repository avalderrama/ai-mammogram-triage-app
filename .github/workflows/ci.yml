# Typecheck, lint, tests, a production build and a dependency audit on every pull request and on main.
# Changes that only touch documentation skip them; "CI result" always reports, so it is the one check that the
# branch protection of main requires (a required check that never runs would block the pull request).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        # Documentation only: Markdown files, docs/, LICENSE and NOTICE. Anything else, or a diff that cannot be
        # computed (first push of a branch), counts as code.
        run: |
          if files=$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null) \
             && ! grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)' <<< "$files"; then
            echo "Documentation only:"; echo "$files"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Typecheck, lint, tests and build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Production build (same-origin server, strict CSP)
        run: npm run build
        env:
          VITE_DEFAULT_SERVER_URL: https://app.mammotriage.com/mcp
      - name: The build only connects to its own server
        run: grep -qF "connect-src 'self' https://app.mammotriage.com;" dist/index.html

  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  result:
    name: CI result
    if: always()
    needs: [changes, check, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped") and .changes.result == "success"' <<< "$NEEDS"
